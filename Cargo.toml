[workspace]
resolver = "2"
members = [
    "crates/sealedmem",
    "crates/residue",
    "examples/service-demo",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "local"

[profile.release]
# Keep frames and be honest about them: residual-copy measurements are easier to
# reason about with a predictable layout.  Never strip symbols in the demo, or the
# core scanner cannot attribute residue to a function.
debug = 2
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.dependencies]
libc = "0.2"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
subtle = "2.6"
memchr = "2.8"
sha2 = { version = "0.11", features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
getrandom = "0.3"
