[package]
name = "secretmem"
description = "Sensitive-data containers: locked, guarded, self-wiping memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zeroize = { version = "1.9", default-features = false }
sha2 = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "ios"))'.dependencies]
libc = "0.2"

[features]
default = ["platform-hardening"]
# Enables mlock / mincore / fork-isolation / dump-exclusion where the OS offers it.
# Turning this off gives a portable best-effort heap backend (still zeroizing).
platform-hardening = []

[dev-dependencies]
